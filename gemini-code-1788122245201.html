<script>
  // Smooth scroll for nav links & buttons
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({
          behavior: 'smooth'
        });
      }
    });
  });

  // Example booking button action
  const bookBtns = document.querySelectorAll('a[href="#book"], .btn-primary');
  bookBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // If you use Calendly, Acuity, or another scheduler, you can launch it here!
      // Example: Calendly.initPopupWidget({url: 'https://calendly.com/your-link'});
    });
  });
</script>
