<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WellnessHunny — Root-Cause Wellness Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf9f5;
    --cream-deep: #f3ede2;
    --cream-light: #ffffff;
    --card: #ffffff;
    --tan-light: #e5d7c5;
    --tan: #c4a988;
    --tan-deep: #8c6d46;
    --ink: #2b2520;
    --ink-soft: #635748;
    --line: #e3d9cd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'Jost', sans-serif; font-weight: 400; line-height: 1.7;
    overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 2; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; margin: 0; color: var(--ink); }
  a { color: var(--tan-deep); }
  .eyebrow {
    font-family: 'Jost', sans-serif; text-transform: uppercase; letter-spacing: 0.18em;
    font-size: 11.5px; font-weight: 600; color: var(--tan-deep);
  }
  .btn {
    font-family: 'Jost', sans-serif; font-weight: 600; font-size: 15px;
    border: none; cursor: pointer; border-radius: 999px; padding: 15px 30px;
    display: inline-block; text-decoration: none; position: relative; overflow: hidden;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--tan-light) 0%, var(--tan) 60%, var(--tan-deep) 100%);
    color: #ffffff; box-shadow: 0 8px 20px rgba(140, 109, 70, 0.25);
  }
  .btn-primary:hover {
    box-shadow: 0 10px 24px rgba(140, 109, 70, 0.35);
    transform: translateY(-1px);
  }
  .btn-ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--tan-deep); }

  nav { padding: 26px 0; position: absolute; width: 100%; top: 0; z-index: 10; }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; color: #fff; font-weight: 600; }
  .logo span { color: var(--tan-light); }
  .nav-links { display: none; }
  @media (min-width: 760px) { 
    .nav-links { display: flex; align-items: center; } 
    .nav-links a { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 28px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--tan-light); }
  }

  /* Full Background Video Containers */
  .video-hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 120px 0 80px;
    color: #ffffff;
    overflow: hidden;
  }
  .video-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(43, 37, 32, 0.65) 0%, rgba(43, 37, 32, 0.8) 100%);
    z-index: 1;
  }

  .hero-text h1 { font-size: 64px; font-style: italic; line-height: 1.05; margin: 20px 0 20px; color: #fff; }
  .hero-text h1 .accent { color: var(--tan-light); }
  .hero-text .sub { font-size: 18px; color: rgba(255,255,255,0.9); max-width: 540px; margin: 0 0 30px; }
  .hero-text .eyebrow { color: var(--tan-light); }

  section { padding: 80px 0; }
  .section-head { margin-bottom: 40px; }
  .section-head.center { text-align: center; }
  .section-head h2 { font-size: 42px; font-style: italic; }
  .section-head p { color: var(--ink-soft); font-size: 16px; margin-top: 10px; }

  /* Full-width Philosophy Video Section */
  .philo-section {
    position: relative;
    padding: 120px 0;
    color: #ffffff;
    overflow: hidden;
  }
  .philo-section h2 { color: #ffffff; }
  .philo-section
